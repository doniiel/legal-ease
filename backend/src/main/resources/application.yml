server:
  port: 9191

spring:
  application:
    name: legal-ease-backend

  datasource:
    url: jdbc:postgresql://localhost:5435/legal-ease
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 30000
    max-lifetime: 1800000
    connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  liquibase:
    change-log: classpath:liquibase/master.xml
    enabled: true

  mail:
    host: smtp.gmail.com
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    port: 587
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
      thread-name-prefix: email-async-

  jwt:
    access-secret: ${SPRING_JWT_ACCESS_SECRET:06d701201a0cec185ac8232ad254e5e52b7000828740253ba228bf3d50f6aec7}
    refresh-secret: ${SPRING_JWT_REFRESH_SECRET:1f9b840af387532bd295de7df4962e11edcb619954305adb36e30ea7c20a42c7}
    issuer: ${SPRING_JWT_ISSUER:legalease}
    access-exp-min: ${SPRING_JWT_ACCESS_EXP_MIN:30}
    refresh-exp-min: ${SPRING_JWT_REFRESH_EXP_MIN:1440}

app:
  share:
    base-url: ${APP_SHARE_BASE_URL:http://localhost:9191}
    expiry-hours: ${APP_SHARE_EXPIRY_HOURS:24}
    # How often (ms) the share-cleanup scheduler runs. Default: 1 hour.
    cleanup-interval-ms: ${APP_SHARE_CLEANUP_INTERVAL_MS:3600000}
  rate-limit:
    ai:
      requests-per-minute: ${APP_RATE_LIMIT_AI_RPM:10}
    complete:
      requests-per-hour: ${APP_RATE_LIMIT_COMPLETE_RPH:20}

storage:
  s3:
    # Internal endpoint used for upload/download operations (Docker: http://minio:9000)
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    # Public endpoint used in presigned URLs returned to clients (always localhost for local dev)
    public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_S3_ACCESS_KEY:minio}
    secret-key: ${STORAGE_S3_SECRET_KEY:minio123}
    bucket: ${STORAGE_S3_BUCKET:documents}
    # Presigned URL validity in minutes
    presign-expiry-minutes: 60
    # Maximum file upload size (default: 20 MB)
    max-file-size-bytes: ${STORAGE_S3_MAX_FILE_SIZE:20971520}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    show-details: always