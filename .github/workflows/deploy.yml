# ─── BUILD IMAGES ─────────────────────────────────────────────────────────────

  backend-build:
    name: Backend — Build & Push Image
    runs-on: ubuntu-latest
#    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:latest
          cache-to: type=inline

  frontend-build:
    name: Frontend — Build & Push Image
    runs-on: ubuntu-latest
#    needs: frontend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:latest
          cache-to: type=inline

# ─── DEPLOY ───────────────────────────────────────────────────────────────────

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [ backend-build, frontend-build ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .env
        run: |
          if [ ! -f /opt/legalease/legal-ease/.env ]; then
            echo ".env file not found!"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest images
        run: |
          docker pull ${{ env.IMAGE_BACKEND }}:latest
          docker pull ${{ env.IMAGE_FRONTEND }}:latest

      - name: Deploy with docker compose
        run: |
          set -e

          export BACKEND_IMAGE=${{ env.IMAGE_BACKEND }}:latest
          export FRONTEND_IMAGE=${{ env.IMAGE_FRONTEND }}:latest

          cp /opt/legalease/legal-ease/.env .env
          DB_USER=$(grep '^POSTGRES_USER=' .env | cut -d'=' -f2-)
          DB_PASS=$(grep '^POSTGRES_PASSWORD=' .env | cut -d'=' -f2-)

          # Data services: start if stopped, never recreate
          docker compose -p legalease -f docker-compose.prod.yml up -d --no-recreate postgres minio
          until docker exec legalease-postgres pg_isready -U "${DB_USER:-postgres}"; do sleep 2; done

          # Ensure pg_hba.conf uses md5 (avoids scram-sha-256/md5 hash mismatch)
          docker exec legalease-postgres bash -c \
            "sed -i 's/scram-sha-256/md5/g' /var/lib/postgresql/data/pgdata/pg_hba.conf"

          # Sync DB password to match .env in md5 format (peer auth — no password required)
          docker exec -u postgres legalease-postgres psql -U "${DB_USER:-postgres}" -c "
            SET password_encryption = 'md5';
            ALTER USER \"${DB_USER:-postgres}\" WITH PASSWORD '${DB_PASS}';
          "

          # Reload postgres config without restart
          docker exec legalease-postgres psql -U "${DB_USER:-postgres}" -c "SELECT pg_reload_conf();"

          # App services: always pull fresh images and recreate (--no-deps = never touch postgres/minio)
          docker compose -p legalease -f docker-compose.prod.yml up -d --force-recreate --no-deps backend frontend nginx

          docker image prune -f

          echo "Deploy complete!"
